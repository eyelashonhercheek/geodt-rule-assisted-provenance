<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="650" viewBox="0 0 1600 650"><rect width="1600" height="650" fill="white"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10Z" fill="#456"/></marker></defs><g font-family="Arial,sans-serif" fill="#172b3a"><text x="800" y="42" font-size="28" text-anchor="middle" font-weight="bold">Auditable cross-scale provenance recovery and evaluation</text><rect x="25" y="82" width="350" height="440" rx="12" fill="#f2f6f8" stroke="#537082" stroke-width="2"/><text x="200" y="119" text-anchor="middle" font-size="22" font-weight="bold">Original report evidence</text><text x="43" y="186" font-size="18">• 100 baseline rows; 1,400</text><text x="43" y="211" font-size="18">  analytical blocks</text><text x="43" y="253" font-size="18">• Five analytical report types</text><text x="43" y="295" font-size="18">• Batch context, directories and</text><text x="43" y="320" font-size="18">  details</text><text x="43" y="362" font-size="18">• Physical page / printed page /</text><text x="43" y="387" font-size="18">  block</text><path d="M380,305 H415" stroke="#456" stroke-width="3" marker-end="url(#a)"/><rect x="425" y="82" width="350" height="440" rx="12" fill="#eff6f1" stroke="#537082" stroke-width="2"/><text x="600" y="119" text-anchor="middle" font-size="22" font-weight="bold">Scoped geological</text><text x="600" y="146" text-anchor="middle" font-size="22" font-weight="bold">interpretation</text><text x="443" y="186" font-size="18">• Preserve original fields and</text><text x="443" y="211" font-size="18">  repeated codes</text><text x="443" y="253" font-size="18">• Separate explicit and coded</text><text x="443" y="278" font-size="18">  stratigraphy</text><text x="443" y="320" font-size="18">• Attribute author corrections to</text><text x="443" y="345" font-size="18">  D3</text><text x="443" y="387" font-size="18">• Retain conditional code-family</text><text x="443" y="412" font-size="18">  mappings</text><path d="M780,305 H815" stroke="#456" stroke-width="3" marker-end="url(#a)"/><rect x="825" y="82" width="350" height="440" rx="12" fill="#f2f6f8" stroke="#537082" stroke-width="2"/><text x="1000" y="119" text-anchor="middle" font-size="22" font-weight="bold">Recovery with fixed</text><text x="1000" y="146" text-anchor="middle" font-size="22" font-weight="bold">policy</text><text x="843" y="186" font-size="18">• Common D3 inputs; unchanged</text><text x="843" y="211" font-size="18">  0.4-r5</text><text x="843" y="253" font-size="18">• Candidate entry and contextual</text><text x="843" y="278" font-size="18">  constraints</text><text x="843" y="320" font-size="18">• Conservative fallback;</text><text x="843" y="345" font-size="18">  documentary holds</text><text x="843" y="387" font-size="18">• Four states with per-step audit</text><text x="843" y="412" font-size="18">  traces</text><path d="M1180,305 H1215" stroke="#456" stroke-width="3" marker-end="url(#a)"/><rect x="1225" y="82" width="350" height="440" rx="12" fill="#fbf6ed" stroke="#537082" stroke-width="2"/><text x="1400" y="119" text-anchor="middle" font-size="22" font-weight="bold">Comparison and human</text><text x="1400" y="146" text-anchor="middle" font-size="22" font-weight="bold">review</text><text x="1243" y="186" font-size="18">• 429 documentary-reference</text><text x="1243" y="211" font-size="18">  relationships</text><text x="1243" y="253" font-size="18">• Twelve baseline / ablation</text><text x="1243" y="278" font-size="18">  configurations</text><text x="1243" y="320" font-size="18">• 89-record human source-document</text><text x="1243" y="345" font-size="18">  review</text><text x="1243" y="387" font-size="18">• 52 accepts + 30 random + 7</text><text x="1243" y="412" font-size="18">  diagnostic</text><text x="800" y="571" font-size="20" text-anchor="middle">Evaluated path: outcrop/source context → sample label → analytical report block</text><text x="800" y="610" font-size="18" text-anchor="middle">Source-page review with system outputs withheld; locators and unresolved cases retained.</text></g></svg>